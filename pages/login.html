<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="Website Icon" type="png" href="../Assets/icons/logo-login.jpg" />
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
  />

  <body>
    <div class="container">
      <h1>🔐 Đăng nhập</h1>
      <form id="form">
        <div class="form-group">
          <input
            type="text"
            name="username"
            id="usernameInput"
            placeholder="Tên đăng nhập"
          />
          <p class="errorIncorrect">Sai tên đăng nhập hoặc mật khẩu</p>
          <p class="errorEmpty">Tên đăng nhập không được bỏ trống</p>
        </div>
        <div class="form-group">
          <input
            type="password"
            name="password"
            id="passwordInput"
            placeholder="Mật khẩu"
          />
          <p class="errorIncorrect">Sai tên đăng nhập hoặc mật khẩu</p>
          <p class="errorEmpty">Mật khẩu không được bỏ trống</p>
        </div>
        <div class="form-group">
          <button type="submit" id="loginButton">Đăng nhập</button>
        </div>
        <footer>
          <p>Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a></p>
        </footer>
      </form>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
